<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Rapor SMP (V45.31 - Fix Delete Modals)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Menggunakan UNPKG untuk Lucide Icons agar lebih stabil -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap');

        body { font-family: 'Inter', sans-serif; }
        .serif { font-family: 'Noto Serif', serif; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); }
        input[type=number] { -moz-appearance: textfield; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; }
            @page { margin: 1cm; size: A4; }
            .page-break { page-break-before: always; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans antialiased">
    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // ==========================================================
        // KONFIGURASI FIREBASE
        // ==========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyATVOK-9nAxqgcWtM4tPKDDUTZQtSLiwIk",
            authDomain: "raporpts-a6843.firebaseapp.com",
            projectId: "raporpts-a6843",
            storageBucket: "raporpts-a6843.firebasestorage.app",
            messagingSenderId: "1051855587376",
            appId: "1:1051855587376:web:3e8d6dcd51b78d66a705f5"
        };

        let app, auth, db;
        try {
            if (firebaseConfig.apiKey) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            }
        } catch (e) { 
            console.warn("Firebase config error:", e); 
        }

        const state = {
            user: null,
            view: 'landing', 
            role: 'guest',
            loading: true,
            searchQuery: '',
            students: [],
            grades: [],
            learningObjectives: [],
            homerooms: [],
            attendance: [],
            teacherNotes: [],
            settings: { 
                dinasName: "PEMERINTAH KABUPATEN ...", schoolName: "SMP NEGERI ...", schoolAddress: "Alamat Sekolah...", 
                headmaster: "Nama Kepala Sekolah", headmasterNip: "198xxxx", semester: "Ganjil", year: "2024/2025", 
                logoDinas: "", logoSekolah: "", printPlace: "Kota", printDate: "",
                geminiApiKey: "" 
            },
            selectedClass: '7A', selectedMapel: 'Matematika', selectedStudentForPrint: null,
            showModal: false, activeStudentId: null, tempAchieved: [], tempImprove: [],
            
            // Modal States
            showLoginModal: false, loginError: null,
            showDeleteModal: false, studentIdToDelete: null,
            showDeleteTPModal: false, tpIdToDelete: null,

            // Toast
            toast: { show: false, message: '', type: 'success' },
            
            importing: false, tpLevel: '7', tpMapel: 'Matematika', saveTimeouts: {},
            currentStudent: null
        };

        // --- HELPER FUNCTIONS ---
        const getClassList = () => {
            const levels = ['7', '8', '9'];
            const sections = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
            let classes = [];
            levels.forEach(l => sections.forEach(s => classes.push(`${l}${s}`)));
            return classes;
        };

        const getSubjects = (className) => {
            let mapel = ["Pendidikan Agama", "Pendidikan Pancasila", "Bahasa Indonesia", "Matematika", "IPA", "IPS", "Bahasa Inggris", "PJOK", "Informatika"];
            if (className.startsWith('7')) { mapel.push("Prakarya", "Koding"); } else { mapel.push("Seni Budaya"); }
            mapel.push("Bahasa Jawa");
            return mapel;
        };

        const getSubjectIcon = (subjectName) => {
            const name = subjectName.toLowerCase();
            if (name.includes('matematika')) return 'calculator';
            if (name.includes('ipa')) return 'flask-conical';
            if (name.includes('ips')) return 'globe';
            if (name.includes('bahasa')) return 'languages';
            if (name.includes('agama')) return 'book-heart';
            if (name.includes('pancasila')) return 'scale';
            if (name.includes('pjok') || name.includes('olahraga')) return 'activity';
            if (name.includes('informatika') || name.includes('koding')) return 'laptop';
            if (name.includes('seni')) return 'palette';
            if (name.includes('prakarya')) return 'hammer';
            return 'book-open';
        };

        const getAbbr = (subject) => {
            const map = { "Pendidikan Agama": "AGM", "Pendidikan Pancasila": "PP", "Bahasa Indonesia": "BInd", "Matematika": "MTK", "IPA": "IPA", "IPS": "IPS", "Bahasa Inggris": "BIng", "PJOK": "PJK", "Informatika": "INF", "Prakarya": "Prky", "Seni Budaya": "SB", "Koding": "KKA", "Bahasa Jawa": "BJw" };
            return map[subject] || subject.substring(0, 3).toUpperCase();
        };

        const renderClassOptions = () => getClassList().map(c => `<option value="${c}" ${state.selectedClass === c ? 'selected' : ''}>Kelas ${c}</option>`).join('');
        
        const generateDescription = (gradeData, subjectName) => {
            if (!gradeData) return "-";
            const achievedCodes = gradeData.tp_achieved || [];
            const improveCodes = gradeData.tp_improvement || [];
            const getDescText = (codes) => {
                return codes.map(code => {
                    const tp = state.learningObjectives.find(l => l.code === code && l.mapel === subjectName);
                    let text = tp ? tp.description : code;
                    return text.charAt(0).toLowerCase() + text.slice(1).replace(/\.$/, ""); 
                }).join(", ");
            };
            let desc = "";
            if (achievedCodes.length > 0) desc += `Menunjukkan penguasaan yang baik dalam ${getDescText(achievedCodes)}. `;
            if (improveCodes.length > 0) desc += `Perlu bimbingan lebih lanjut dalam ${getDescText(improveCodes)}.`;
            return desc || "Belum ada deskripsi capaian.";
        };

        const getRaporHtmlContent = (s) => {
            const printSubjects = getSubjects(s.class);
            const hr = state.homerooms.find(h => h.id === s.class) || { name: '.....................', nip: '.....................' };
            const att = state.attendance.find(a => a.studentId === s.id) || { s: 0, i: 0, a: 0 };
            const note = state.teacherNotes.find(n => n.studentId === s.id) || { text: "-" };
            const dateNow = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            let rowsHtml = '';
            printSubjects.forEach((sub, idx) => {
                const g = state.grades.find(x => x.studentId === s.id && x.mapel === sub) || { score: 0 };
                const desc = generateDescription(g, sub);
                rowsHtml += `<tr><td class="text-center p-2">${idx+1}</td><td class="p-2 font-bold">${sub}</td><td class="text-center font-bold p-2">${g.score || '-'}</td><td class="text-sm p-2 text-justify">${desc}</td></tr>`;
            });
            const logoDinasHtml = state.settings.logoDinas ? `<img src="${state.settings.logoDinas}" style="height: 80px; width: auto; position: absolute; left: 0; top: 0;">` : '';
            const logoSekolahHtml = state.settings.logoSekolah ? `<img src="${state.settings.logoSekolah}" style="height: 80px; width: auto; position: absolute; right: 0; top: 0;">` : '';
            const place = state.settings.printPlace || "Kota";
            const date = state.settings.printDate || dateNow;
            
            return `
            <div style="position: relative; min-height: 100px; margin-bottom: 20px; border-bottom: 4px double black; padding-bottom: 10px;">
                ${logoDinasHtml}${logoSekolahHtml}
                <div class="text-center" style="margin: 0 90px;">
                    <h3 class="text-lg font-normal uppercase mb-1" style="margin:0;">${state.settings.dinasName}</h3>
                    <h2 class="text-2xl font-bold uppercase tracking-widest" style="margin:5px 0;">${state.settings.schoolName}</h2>
                    <p class="text-sm" style="margin:0;">${state.settings.schoolAddress}</p>
                </div>
            </div>
            <div class="text-center mb-6"><p class="text-lg font-bold uppercase">Laporan Hasil Belajar (Rapor)</p></div>
            <div class="flex justify-between mb-6 text-sm" style="display: flex; justify-content: space-between;">
                <table class="no-border" style="width: 50%;"><tr><td style="width: 120px;">Nama Siswa</td><td>: <b>${s.name.toUpperCase()}</b></td></tr><tr><td>NIS</td><td>: ${s.nis}</td></tr></table>
                <table class="no-border" style="width: 40%;"><tr><td style="width: 80px;">Kelas</td><td>: <b>${s.class}</b></td></tr><tr><td>Semester</td><td>: ${state.settings.semester} / ${state.settings.year}</td></tr></table>
            </div>
            <h3 class="font-bold mb-2 text-sm border-b border-black inline-block">A. Nilai Akademik</h3>
            <table class="mb-8">
                <thead><tr class="bg-gray-100"><th style="width: 30px;">No</th><th>Mata Pelajaran</th><th style="width: 60px;">Nilai</th><th>Capaian Kompetensi</th></tr></thead>
                <tbody>${rowsHtml}</tbody>
            </table>
            <div style="display: flex; gap: 30px; margin-bottom: 30px;">
                <div style="width: 50%;">
                    <h3 class="font-bold mb-2 text-sm border-b border-black inline-block">B. Ketidakhadiran</h3>
                    <table><tr><td style="width: 120px;">Sakit</td><td class="text-center">${att.s}</td><td>hari</td></tr><tr><td>Izin</td><td class="text-center">${att.i}</td><td>hari</td></tr><tr><td>Tanpa Ket</td><td class="text-center">${att.a}</td><td>hari</td></tr></table>
                </div>
                <div style="width: 50%;">
                    <h3 class="font-bold mb-2 text-sm border-b border-black inline-block">C. Catatan Wali Kelas</h3>
                    <div style="border: 1px solid black; min-height: 80px; padding: 5px; font-size: 12px;">${note.text}</div>
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 50px; text-align: center; font-size: 12px;">
                <div style="width: 30%;"><p style="margin-bottom: 80px;">Mengetahui,<br>Orang Tua/Wali</p><p style="border-top: 1px solid black; display: inline-block; padding: 0 20px;">( ................................... )</p></div>
                <div style="width: 30%;"><p style="margin-bottom: 80px;">Mengetahui,<br>Kepala Sekolah</p><p style="font-weight: bold; text-decoration: underline;">${state.settings.headmaster}</p><p>NIP. ${state.settings.headmasterNip}</p></div>
                <div style="width: 30%;"><p style="margin-bottom: 80px;">${place}, ${date}<br>Wali Kelas</p><p style="font-weight: bold; text-decoration: underline;">${hr.name}</p><p>NIP. ${hr.nip}</p></div>
            </div>`;
        };

        const openPrintWindow = (title, contentHtml) => {
            const printWindow = window.open('', '_blank');
            if (!printWindow) { alert("Pop-up diblokir. Izinkan pop-up untuk mencetak."); return; }
            const html = `<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><title>${title}</title><script src="https://cdn.tailwindcss.com"><\/script><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap');body{font-family:'Noto Serif',serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid black;padding:4px 8px}.no-border td{border:none}.text-justify{text-align:justify}.editable-print:empty:before{content:attr(data-placeholder);color:#ccc}@media print{.page-break{page-break-before:always}body{margin:0;padding:20px}.no-print{display:none}.editable-print:empty:before{content:""}}</style></head><body class="bg-white text-black p-8">${contentHtml}<script>window.onload=()=>{setTimeout(()=>{window.print()},1000)};<\/script></body></html>`;
            printWindow.document.write(html); printWindow.document.close();
        };

        // --- ACTIONS ---
        window.actions = {
            navigate: (view) => { state.view = view; window.render(); },
            updateState: (key, value) => { state[key] = value; window.render(); },
            setSearch: (val) => { state.searchQuery = val.toLowerCase(); window.render(); },
            
            showToast: (msg, type = 'success') => {
                state.toast = { show: true, message: msg, type };
                window.render();
                setTimeout(() => { state.toast.show = false; window.render(); }, 3000);
            },

            // --- GEMINI AI FEATURES ---
            generateStudentAnalysis: async (studentId) => {
                const btn = document.getElementById(`btn-analyze-${studentId}`);
                if (!btn) return;
                
                const userApiKey = state.settings.geminiApiKey;
                if (!userApiKey) {
                    window.actions.showToast("Harap isi API Key Gemini di menu Pengaturan!", "error");
                    return;
                }

                const originalContent = btn.innerHTML;
                btn.innerHTML = `<div class="loader w-3 h-3 border-2 border-white border-t-transparent"></div>`;
                btn.disabled = true;

                const s = state.students.find(st => st.id === studentId);
                const subjects = getSubjects(s.class);
                let gradeDetails = [];
                let total = 0;
                let count = 0;

                subjects.forEach(sub => {
                    const g = state.grades.find(x => x.studentId === s.id && x.mapel === sub);
                    if (g && g.score > 0) {
                        gradeDetails.push(`${sub}: ${g.score}`);
                        total += g.score;
                        count++;
                    }
                });

                if (count === 0) {
                    window.actions.showToast("Belum ada data nilai untuk dianalisa.", "error");
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                    return;
                }

                const avg = (total / count).toFixed(1);
                const prompt = `Bertindaklah sebagai Wali Kelas SMP yang bijak. Buatkan catatan rapor singkat (maksimal 30 kata), personal, dan memotivasi untuk siswa bernama ${s.name}. Data: Rata-rata ${avg}, Detail: ${gradeDetails.join(', ')}.`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${userApiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    
                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);
                    
                    const analysis = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    
                    if (analysis) {
                        const textarea = document.getElementById(`note-${studentId}`);
                        if (textarea) {
                            textarea.value = analysis.trim();
                            window.actions.updateTeacherNote(studentId, textarea);
                            window.actions.showToast("Analisa AI berhasil dibuat!");
                        }
                    }
                } catch (e) {
                    console.error(e);
                    window.actions.showToast("Gagal. Cek API Key di Pengaturan.", "error");
                } finally {
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                    if (window.lucide) window.lucide.createIcons();
                }
            },

            // Login Actions
            openLoginModal: () => { 
                state.showLoginModal = true; state.loginError = null; window.render();
                setTimeout(() => document.getElementById('admin-password-input')?.focus(), 50);
            },
            closeLoginModal: () => { state.showLoginModal = false; window.render(); },
            verifyLogin: () => {
                const input = document.getElementById('admin-password-input').value;
                if (input === "123456") { state.role = 'admin'; state.showLoginModal = false; window.actions.navigate('dashboard'); }
                else { state.loginError = "Kode salah. Silakan coba lagi."; window.render(); document.getElementById('admin-password-input').value = ''; document.getElementById('admin-password-input').focus(); }
            },

            loginStudent: () => {
                const nis = document.getElementById('student-nis').value.trim();
                if(!nis) return alert("Masukkan NIS!");
                const student = state.students.find(s => s.nis === nis);
                if (student) { state.role = 'student'; state.currentStudent = student; window.actions.navigate('student_dashboard'); }
                else { alert("NIS tidak ditemukan. Hubungi Wali Kelas."); }
            },
            logout: () => { state.role = 'guest'; state.currentStudent = null; window.actions.navigate('landing'); },

            updateGradeScore: (studentId, el) => {
                const value = el.value;
                let grade = state.grades.find(g => g.studentId === studentId && g.mapel === state.selectedMapel);
                if (!grade) { grade = { studentId, mapel: state.selectedMapel, score: 0, tp_achieved: [], tp_improvement: [] }; state.grades.push(grade); }
                const numVal = parseFloat(value); grade.score = isNaN(numVal) ? 0 : numVal;
                if (grade.score > 100) { el.classList.add('bg-red-50', 'text-red-600'); } else { el.classList.remove('bg-red-50', 'text-red-600'); }
                const docId = grade.id || `${studentId}_${state.selectedMapel.replace(/\s/g, '')}`;
                if (state.saveTimeouts[docId]) clearTimeout(state.saveTimeouts[docId]);
                state.saveTimeouts[docId] = setTimeout(async () => { try { await setDoc(doc(db, 'grades', docId), { ...grade, id: docId }); } catch (e) {} delete state.saveTimeouts[docId]; }, 1000);
            },
            manualSaveGrade: async (studentId) => {
                const grade = state.grades.find(g => g.studentId === studentId && g.mapel === state.selectedMapel);
                if (!grade) { window.actions.showToast("Belum ada data nilai untuk disimpan.", 'error'); return; }
                const docId = grade.id || `${studentId}_${state.selectedMapel.replace(/\s/g, '')}`;
                try { await setDoc(doc(db, 'grades', docId), { ...grade, id: docId }); window.actions.showToast(`Nilai berhasil disimpan!`); } catch (e) { window.actions.showToast("Gagal menyimpan data.", 'error'); }
            },
            openTPModal: (studentId) => { 
                state.activeStudentId = studentId; 
                const g = state.grades.find(gr => gr.studentId === studentId && gr.mapel === state.selectedMapel) || {}; 
                state.tempAchieved = g.tp_achieved ? [...g.tp_achieved] : []; 
                state.tempImprove = g.tp_improvement ? [...g.tp_improvement] : []; 
                state.showModal = true; window.render(); 
            },
            closeModal: () => { state.showModal = false; window.render(); },
            toggleTP: (code, type) => { 
                const target = type === 'achieved' ? state.tempAchieved : state.tempImprove; 
                const other = type === 'achieved' ? state.tempImprove : state.tempAchieved; 
                const idx = target.indexOf(code);
                if (idx > -1) { target.splice(idx, 1); } else { target.push(code); const oIdx = other.indexOf(code); if(oIdx > -1) other.splice(oIdx, 1); }
                window.render(); 
            },
            saveTPSelection: async () => { 
                let grade = state.grades.find(g => g.studentId === state.activeStudentId && g.mapel === state.selectedMapel); 
                if (!grade) { grade = { studentId: state.activeStudentId, mapel: state.selectedMapel, score: 0 }; state.grades.push(grade); } 
                grade.tp_achieved = state.tempAchieved; grade.tp_improvement = state.tempImprove; 
                const docId = grade.id || `${state.activeStudentId}_${state.selectedMapel.replace(/\s/g, '')}`; 
                try { await setDoc(doc(db, 'grades', docId), { ...grade, id: docId }); state.showModal = false; window.render(); } catch (e) { alert("Gagal menyimpan TP"); } 
            },
            updateAttendance: (id, f, el) => { const v = parseInt(el.value)||0; let a = state.attendance.find(x=>x.studentId===id); if(!a){a={studentId:id,s:0,i:0,a:0}; state.attendance.push(a);} a[f]=v; },
            updateTeacherNote: (id, el) => { let n = state.teacherNotes.find(x=>x.studentId===id); if(!n){n={studentId:id,text:''}; state.teacherNotes.push(n);} n.text=el.value; },
            saveStudentData: async (id) => {
                const att = state.attendance.find(x=>x.studentId===id) || {studentId:id, s:0, i:0, a:0};
                const note = state.teacherNotes.find(x=>x.studentId===id) || {studentId:id, text:''};
                try { await setDoc(doc(db, 'attendance', id), att); await setDoc(doc(db, 'teacher_notes', id), note); window.actions.showToast("Data siswa berhasil disimpan!"); } catch(e) { window.actions.showToast("Gagal menyimpan data.", 'error'); }
            },
            updateHomeroomLocal: (c, f, v) => { let hr = state.homerooms.find(h => h.id === c); if (!hr) { hr = { id: c, name: '', nip: '' }; state.homerooms.push(hr); } hr[f] = v; },
            saveHomeroom: async (c) => { const hr = state.homerooms.find(h => h.id === c); if(!hr) return; try { await setDoc(doc(db, 'homerooms', c), hr); window.actions.showToast('Data Wali Kelas tersimpan!'); } catch(e){} },
            addStudent: async () => { const n=document.getElementById('new-name').value; const i=document.getElementById('new-nis').value; if(!n||!i) return alert('Isi data!'); try { await addDoc(collection(db, 'students'), { name: n, nis: i, class: state.selectedClass, gender: 'L' }); document.getElementById('new-name').value=''; document.getElementById('new-nis').value=''; window.actions.showToast('Siswa ditambah!'); } catch(e) {} },
            
            // --- DELETE ACTIONS ---
            openDeleteModal: (id) => { state.studentIdToDelete = id; state.showDeleteModal = true; window.render(); },
            closeDeleteModal: () => { state.showDeleteModal = false; state.studentIdToDelete = null; window.render(); },
            confirmDelete: async () => { if (state.studentIdToDelete) { try { await deleteDoc(doc(db, 'students', state.studentIdToDelete)); state.showDeleteModal = false; state.studentIdToDelete = null; window.actions.showToast("Data siswa berhasil dihapus."); window.render(); } catch (e) { window.actions.showToast("Gagal menghapus siswa.", 'error'); } } },
            openDeleteTPModal: (id) => { state.tpIdToDelete = id; state.showDeleteTPModal = true; window.render(); },
            closeDeleteTPModal: () => { state.showDeleteTPModal = false; state.tpIdToDelete = null; window.render(); },
            confirmDeleteTP: async () => { if (state.tpIdToDelete) { try { await deleteDoc(doc(db, 'learning_objectives', state.tpIdToDelete)); state.showDeleteTPModal = false; state.tpIdToDelete = null; window.actions.showToast("Data TP berhasil dihapus."); window.render(); } catch (e) { window.actions.showToast("Gagal menghapus TP.", 'error'); } } },

            downloadTemplate: () => { const content = "Nama Lengkap,NIS\nBudi Santoso,1001\nSiti Aminah,1002"; const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob); const link = document.createElement("a"); link.setAttribute("href", url); link.setAttribute("download", "template_siswa.csv"); document.body.appendChild(link); link.click(); document.body.removeChild(link); },
            triggerImport: () => { document.getElementById('import-file').click(); },

change="window.actions.updateSettingVal('schoolAddress', this.value)" class="w-full px-4 py-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-sm h-24 resize-none">${state.settings.schoolAddress}</textarea></div></div></div><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100"><div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-600"><i data-lucide="calendar-range" class="w-5 h-5"></i></div><div><h3 class="font-bold text-slate-800">Tahun Ajaran & Pimpinan</h3><p class="text-xs text-slate-500">Periode aktif dan penandatangan.</p></div></div><div class="grid grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-semibold text-slate-700 mb-1">Semester</label><select onchange="window.actions.updateSettingVal('semester', this.value)" class="w-full px-4 py-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 text-sm bg-white"><option value="Ganjil" ${state.settings.semester==='Ganjil'?'selected':''}>Ganjil</option><option value="Genap" ${state.settings.semester==='Genap'?'selected':''}>Genap</option></select></div><div><label class="block text-sm font-semibold text-slate-700 mb-1">Tahun Pelajaran</label><input type="text" value="${state.settings.year}" onchange="window.actions.updateSettingVal('year', this.value)" class="w-full px-4 py-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="2024/2025"></div></div><div class="space-y-4"><div><label class="block text-sm font-semibold text-slate-700 mb-1">Nama Kepala Sekolah</label><div class="relative"><i data-lucide="user" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i><input type="text" value="${state.settings.headmaster}" onchange="window.actions.updateSettingVal('headmaster', this.value)" class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm"></div></div><div><label class="block text-sm font-semibold text-slate-700 mb-1">NIP Kepala Sekolah</label><div class="relative"><i data-lucide="badge-check" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i><input type="text" value="${state.settings.headmasterNip}" onchange="window.actions.updateSettingVal('headmasterNip', this.value)" class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm"></div></div></div></div><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 lg:col-span-2"><div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100"><div class="w-10 h-10 rounded-full bg-violet-50 flex items-center justify-center text-violet-600"><i data-lucide="map-pin" class="w-5 h-5"></i></div><div><h3 class="font-bold text-slate-800">Konfigurasi Cetak</h3><p class="text-xs text-slate-500">Tempat, tanggal, dan logo rapor.</p></div></div><div class="grid grid-cols-2 gap-6 mb-6"><div><label class="block text-sm font-semibold text-slate-700 mb-1">Tempat TTD</label><input type="text" value="${state.settings.printPlace}" onchange="window.actions.updateSettingVal('printPlace', this.value)" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-violet-500 text-sm"></div><div><label class="block text-sm font-semibold text-slate-700 mb-1">Tanggal Rapor</label><input type="text" value="${state.settings.printDate}" onchange="window.actions.updateSettingVal('printDate', this.value)" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-violet-500 text-sm" placeholder="20 Desember 2024"></div></div><div class="grid grid-cols-2 gap-6 pt-4 border-t border-slate-100"><div><label class="block text-sm font-semibold text-slate-700 mb-2">Logo Dinas</label><input type="file" onchange="window.actions.handleLogoUpload('logoDinas', this)" class="text-xs w-full mb-2">${state.settings.logoDinas ? `<div class="h-20 border rounded bg-slate-50 flex items-center justify-center"><img src="${state.settings.logoDinas}" class="h-16"></div>` : ''}</div><div><label class="block text-sm font-semibold text-slate-700 mb-2">Logo Sekolah</label><input type="file" onchange="window.actions.handleLogoUpload('logoSekolah', this)" class="text-xs w-full mb-2">${state.settings.logoSekolah ? `<div class="h-20 border rounded bg-slate-50 flex items-center justify-center"><img src="${state.settings.logoSekolah}" class="h-16"></div>` : ''}</div></div></div><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100"><div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600"><i data-lucide="sparkles" class="w-5 h-5"></i></div><div><h3 class="font-bold text-slate-800">Integrasi AI</h3><p class="text-xs text-slate-500">Konfigurasi Google Gemini AI.</p></div></div><div class="space-y-4"><div><label class="block text-sm font-semibold text-slate-700 mb-1">Gemini API Key</label><div class="relative"><i data-lucide="key" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i><input type="password" value="${state.settings.geminiApiKey || ''}" onchange="window.actions.updateSettingVal('geminiApiKey', this.value)" class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="Masukkan API Key Gemini..."></div><p class="text-[10px] text-slate-400 mt-1 italic">Dapatkan API Key di Google AI Studio untuk mengaktifkan fitur analisa otomatis.</p></div></div></div></div></div>`;
            }

            // --- ADMIN SIDEBAR GROUPING ---
            const navGroups = [{title: 'Menu Utama', items: [{ id: 'dashboard', label: 'Dashboard', icon: 'layout-grid' }]}, {title: 'Akademik', items: [{ id: 'data_siswa', label: 'Data Siswa', icon: 'graduation-cap' }, { id: 'input_nilai', label: 'Input Nilai', icon: 'clipboard-edit' }, { id: 'tp_settings', label: 'Data TP', icon: 'book-open-check' }, { id: 'cetak', label: 'Cetak & Leger', icon: 'printer' }]}, {title: 'Sistem', items: [{ id: 'settings', label: 'Pengaturan', icon: 'settings-2' }]}];
            const sidebarLinks = navGroups.map(group => `<div class="mb-4"><h3 class="px-4 mb-2 text-xs font-bold text-slate-400 uppercase tracking-wider">${group.title}</h3><div class="space-y-1">${group.items.map(item => `<button onclick="window.actions.navigate('${item.id}')" class="w-full flex items-center gap-3 px-4 py-2 rounded-lg text-sm font-medium transition-colors ${state.view === item.id ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}"><i data-lucide="${item.icon}" class="w-4 h-4"></i>${item.label}</button>`).join('')}</div></div>`).join('');

            root.innerHTML = `
                <div class="flex h-screen bg-slate-50 overflow-hidden">
                    <!-- Sidebar -->
                    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex-shrink-0 flex flex-col hidden md:flex z-10">
                        <div class="p-6 border-b border-slate-800 flex items-center gap-3"><div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">R</div><h1 class="font-bold text-white tracking-tight">E-RAPOR ADMIN</h1></div>
                        <nav class="flex-1 p-4 overflow-y-auto">${sidebarLinks}</nav>
                        <div class="p-4 border-t border-slate-800"><button onclick="window.actions.logout()" class="w-full flex items-center gap-2 px-4 py-2 text-sm text-red-400 hover:bg-slate-800 rounded-lg font-bold transition-colors"><i data-lucide="log-out" class="w-4 h-4"></i> Keluar</button></div>
                    </aside>
                    <!-- Main Content -->
                    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
                        ${state.view !== 'student_dashboard' && state.view !== 'student-login' && state.view !== 'landing' ? `<header class="bg-white border-b border-slate-200 p-4 flex justify-between items-center md:hidden"><div class="font-bold text-slate-800">E-RAPOR ADMIN</div><button onclick="window.actions.logout()" class="text-red-600"><i data-lucide="log-out" class="w-5 h-5"></i></button></header>` : ''}
                        <div class="flex-1 overflow-auto ${state.view !== 'student_dashboard' && state.view !== 'student-login' && state.view !== 'landing' ? 'p-4 md:p-8' : ''}">${mainContent}</div>
                        ${modalHtml}
                        ${state.showDeleteModal ? `<div class="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm"><div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm"><div class="flex items-center gap-3 text-red-600 mb-4"><div class="bg-red-100 p-3 rounded-full"><i data-lucide="trash-2" class="w-6 h-6"></i></div><h3 class="text-lg font-bold text-slate-800">Hapus Siswa?</h3></div><p class="text-slate-600 mb-6 text-sm">Apakah Anda yakin ingin menghapus data siswa ini? Tindakan ini tidak dapat dibatalkan.</p><div class="flex gap-3"><button onclick="window.actions.closeDeleteModal()" class="flex-1 px-4 py-2 border border-slate-300 text-slate-700 font-bold rounded-lg hover:bg-slate-50">Batal</button><button onclick="window.actions.confirmDelete()" class="flex-1 px-4 py-2 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700">Ya, Hapus</button></div></div></div>` : ''}
                        ${state.showDeleteTPModal ? `<div class="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm"><div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm"><div class="flex items-center gap-3 text-red-600 mb-4"><div class="bg-red-100 p-3 rounded-full"><i data-lucide="trash-2" class="w-6 h-6"></i></div><h3 class="text-lg font-bold text-slate-800">Hapus TP?</h3></div><p class="text-slate-600 mb-6 text-sm">Apakah Anda yakin ingin menghapus Tujuan Pembelajaran ini? Tindakan ini tidak dapat dibatalkan.</p><div class="flex gap-3"><button onclick="window.actions.closeDeleteTPModal()" class="flex-1 px-4 py-2 border border-slate-300 text-slate-700 font-bold rounded-lg hover:bg-slate-50">Batal</button><button onclick="window.actions.confirmDeleteTP()" class="flex-1 px-4 py-2 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700">Ya, Hapus</button></div></div></div>` : ''}
                        ${state.showModal && state.activeStudentId ? (() => {
                             const availableTPs = state.learningObjectives.filter(l => l.mapel === state.selectedMapel && l.level === state.selectedClass.charAt(0));
                             const tpList = availableTPs.length > 0 ? availableTPs.map(tp => `<div class="flex items-start gap-2 mb-2 p-2 border rounded hover:bg-slate-50"><div class="w-1/2"><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" ${state.tempAchieved.includes(tp.code) ? 'checked' : ''} onchange="window.actions.toggleTP('${tp.code}', 'achieved')" class="w-4 h-4 text-green-600 rounded"><span class="text-xs font-bold text-green-700">Tercapai</span></label></div><div class="w-1/2"><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" ${state.tempImprove.includes(tp.code) ? 'checked' : ''} onchange="window.actions.toggleTP('${tp.code}', 'improve')" class="w-4 h-4 text-orange-600 rounded"><span class="text-xs font-bold text-orange-700">Perlu Bimbingan</span></label></div><div class="flex-1 text-xs"><span class="font-bold text-slate-700">${tp.code}</span>: ${tp.description}</div></div>`).join('') : '<p class="text-slate-500 text-sm italic">Belum ada data TP untuk mapel ini. Tambahkan di menu Data TP.</p>';
                             return `<div class="fixed inset-0 z-50 flex items-center justify-center modal-overlay"><div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden"><div class="bg-blue-600 p-4 flex justify-between items-center text-white"><h3 class="font-bold">Pilih Capaian Kompetensi (TP)</h3><button onclick="window.actions.closeModal()" class="hover:text-blue-200"><i data-lucide="x" class="w-5 h-5"></i></button></div><div class="p-4 max-h-[60vh] overflow-y-auto">${tpList}</div><div class="p-4 bg-slate-50 border-t flex justify-end gap-2"><button onclick="window.actions.closeModal()" class="px-4 py-2 text-slate-600 font-bold hover:bg-slate-200 rounded">Batal</button><button onclick="window.actions.saveTPSelection()" class="px-4 py-2 bg-blue-600 text-white font-bold hover:bg-blue-700 rounded">Simpan</button></div></div></div>`;
                        })() : ''}
                        ${state.toast.show ? `<div class="fixed bottom-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg text-white font-bold animate-bounce ${state.toast.type === 'error' ? 'bg-red-600' : 'bg-green-600'}">${state.toast.message}</div>` : ''}
                    </main>
                </div>
            `;
            
            loadIcons();
        };

        window.render();
    </script>
</body>
</html>
